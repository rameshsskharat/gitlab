apiVersion: apps/v1
kind: Deployment
metadata:
  name: ioclproject
  namespace: priartechnoworld-dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flask-app1
  template:
    metadata:
      labels:
        app: flask-app1
    spec:
      containers:
      - name: flask-app
        image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
        ports:
        - containerPort: 8080
      imagePullSecrets:
        - name: gitlab-registry-secret